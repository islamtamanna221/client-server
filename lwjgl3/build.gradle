// =============================================================================
// 🛠️ LIBGDX MULTI-PROJECT GRADLE BUILD CONFIGURATION
// =============================================================================

buildscript {
  repositories {
    mavenLocal()
    mavenCentral()
    gradlePluginPortal()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    google()
  }
  dependencies {
    // LibGDX Gradle Plugins (যদি আপনার প্রজেক্টে এক্সট্রা প্লাগইন থাকে, তা এখানে থাকবে)
  }
}

allprojects {
  apply plugin: "eclipse"
  apply plugin: "idea"

  version = '1.0.0'
  ext {
    appName = "pokemon-game"
    gdxVersion = '1.12.1' // আপনার প্রজেক্টের LibGDX ভার্সন অনুযায়ী এটি অটো সেট থাকবে
    roboVMVersion = '2.3.20'
    box2DLightsVersion = '1.5'
    ashleyVersion = '1.7.4'
    aiVersion = '1.8.2'
    gdxControllersVersion = '2.2.3'
  }

  repositories {
    mavenLocal()
    mavenCentral()
    google()
    gradlePluginPortal()
    maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { url "https://oss.sonatype.org/content/repositories/releases/" }
    maven { url "https://jitpack.io" }
  }
}

// 🎯 ১. CORE PROJECT (এখানেই মূল গেম লজিক এবং NewBattleScreen থাকে)
project(":core") {
  apply plugin: "java-library"

  dependencies {
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"

    // 🔄 WebSocket বা অন্যান্য নেটওয়ার্কিং ডিপেন্ডেন্সি (আগে যা ছিল)
    implementation "org.java-websocket:Java-WebSocket:1.5.3"

    // 🎯 [ADDED] MySQL Driver - এটি গেম ক্লায়েন্টকে সরাসরি XAMPP ডাটাবেজের সাথে কানেক্ট করবে
    implementation 'com.mysql:mysql-connector-j:8.3.0'
  }
}

// 🖥️ ২. LWJGL3 DESKTOP LAUNCHER PROJECT
project(":lwjgl3") {
  apply plugin: "java"

  dependencies {
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
  }
}
